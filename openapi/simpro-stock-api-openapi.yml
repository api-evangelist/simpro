openapi: 3.2.0
info:
  title: Simpro REST Stock API
  description: The Simpro (simPRO) REST API v1.0 provides a RESTful interface to view, create, and modify resources on a Simpro Premium build - the field service, trade, and project management platform.
  version: '1.0'
  contact:
    name: Simpro Developer Center
    url: https://developer.simprogroup.com/
  x-access-model: Not a shared public API. Access requires an existing Simpro Premium subscription and API access enabled on that build; OAuth2 client credentials are provisioned per build by the account administrator. Base host is the customer's own build subdomain, not a single global endpoint.
servers:
- url: https://{build}.simprosuite.com/api/v1.0
  description: Per-build Simpro Premium host. Replace {build} with your build subdomain.
  variables:
    build:
      default: your-build
      description: Your Simpro Premium build subdomain - the same domain you use to log in to the Simpro staff portal (e.g. mycompany in mycompany.simprosuite.com).
security:
- oauth2: []
tags:
- name: Stock
  description: Inventory held on storage devices.
paths:
  /companies/{companyID}/storageDevices/{storageDeviceID}/stock/:
    parameters:
    - $ref: '#/components/parameters/CompanyID'
    - $ref: '#/components/parameters/StorageDeviceID'
    get:
      operationId: listStock
      tags:
      - Stock
      summary: List stock on a storage device
      description: Lists the catalog stock items held on a given storage device.
      parameters:
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A list of stock items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /companies/{companyID}/storageDevices/{storageDeviceID}/stock/{catalogID}:
    parameters:
    - $ref: '#/components/parameters/CompanyID'
    - $ref: '#/components/parameters/StorageDeviceID'
    - $ref: '#/components/parameters/CatalogID'
    get:
      operationId: getStockItem
      tags:
      - Stock
      summary: Retrieve a stock item
      responses:
        '200':
          description: The requested stock item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    StockListItem:
      type: object
      description: Modeled from the storage-device stock resource. Verify field names against the Simpro API reference.
      properties:
        Catalog:
          type: object
          additionalProperties: true
        Quantity:
          type: number
    Error:
      type: object
      description: Modeled error envelope. Verify the exact shape against the Simpro API reference.
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              key:
                type: string
  parameters:
    PageSize:
      name: pageSize
      in: query
      required: false
      description: The maximum number of results to return per page.
      schema:
        type: integer
    CompanyID:
      name: companyID
      in: path
      required: true
      description: The company ID. A build with Multi-company setup may have companyID >= 0; other builds use 0 by default.
      schema:
        type: integer
        default: 0
    StorageDeviceID:
      name: storageDeviceID
      in: path
      required: true
      description: The storage device's ID.
      schema:
        type: integer
    CatalogID:
      name: catalogID
      in: path
      required: true
      description: The catalog item's ID.
      schema:
        type: integer
    Search:
      name: search
      in: query
      required: false
      description: Search filter. With search=all the result must match all provided fields; with search=any it may match any of them.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: The page number on a paginated request.
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Missing or invalid OAuth2 Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'OAuth2 issued by the customer''s own Simpro build. Access tokens are obtained from https://{build}.simprosuite.com/oauth2/token and sent as `Authorization: Bearer ACCESS_TOKEN`. Both the client credentials and authorization code grants are supported depending on how the API application is registered on the build.'
      flows:
        clientCredentials:
          tokenUrl: https://your-build.simprosuite.com/oauth2/token
          scopes: {}
        authorizationCode:
          authorizationUrl: https://your-build.simprosuite.com/oauth2/authorize
          tokenUrl: https://your-build.simprosuite.com/oauth2/token
          scopes: {}
