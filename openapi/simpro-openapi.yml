openapi: 3.0.3
info:
  title: Simpro REST API
  description: >-
    The Simpro (simPRO) REST API v1.0 provides a RESTful interface to view,
    create, and modify resources on a Simpro Premium build - the field service,
    trade, and project management platform. The API is hosted on each customer's
    own build, so the host is per-build (for example
    https://your-build.simprosuite.com) and requests are authenticated with an
    OAuth2 Bearer access token issued by that same build's /oauth2/token
    endpoint. Most resources are nested under a company:
    /api/v1.0/companies/{companyID}/... where companyID is 0 on single-company
    builds. This document models a representative, commonly used subset of the
    API - companies, customers, sites, jobs, quotes, invoices, schedules,
    vendor orders, cost centers, stock, and webhook subscriptions. The full
    published API covers 300+ resource types. Endpoint paths, HTTP methods, the
    common list/search query parameters, and the confirmed list/read response
    fields are grounded in Simpro's published API reference; request bodies for
    create/update are modeled minimally and marked as such, because the real
    payloads are large and build-configuration dependent.
  version: '1.0'
  contact:
    name: Simpro Developer Center
    url: https://developer.simprogroup.com/
  x-access-model: >-
    Not a shared public API. Access requires an existing Simpro Premium
    subscription and API access enabled on that build; OAuth2 client
    credentials are provisioned per build by the account administrator. Base
    host is the customer's own build subdomain, not a single global endpoint.
servers:
  - url: https://{build}.simprosuite.com/api/v1.0
    description: Per-build Simpro Premium host. Replace {build} with your build subdomain.
    variables:
      build:
        default: your-build
        description: >-
          Your Simpro Premium build subdomain - the same domain you use to log
          in to the Simpro staff portal (e.g. mycompany in
          mycompany.simprosuite.com).
security:
  - oauth2: []
tags:
  - name: Companies
    description: Company information on the build (multi-company aware).
  - name: Customers
    description: Company and individual customers that receive invoices.
  - name: Sites
    description: Customer sites and service locations.
  - name: Jobs
    description: Job lifecycle - scheduling, stock, assets, forms, and billing.
  - name: Quotes
    description: Quote creation and management.
  - name: Invoices
    description: Customer invoicing.
  - name: Schedules
    description: Resource and staff scheduling records.
  - name: Vendor Orders
    description: Purchase orders raised to vendors/suppliers.
  - name: Cost Centers
    description: Accounting cost center setup.
  - name: Stock
    description: Inventory held on storage devices.
  - name: Webhooks
    description: Webhook subscriptions for build event notifications.
paths:
  /companies/:
    get:
      operationId: listCompanies
      tags:
        - Companies
      summary: List all companies
      description: Lists the companies available on this build.
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Columns'
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: A list of companies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
