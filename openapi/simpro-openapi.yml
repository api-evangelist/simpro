components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >-
        OAuth2 issued by the customer's own Simpro build. Access tokens are
        obtained from https://{build}.simprosuite.com/oauth2/token and sent as
        `Authorization: Bearer ACCESS_TOKEN`. Both the client credentials and
        authorization code grants are supported depending on how the API
        application is registered on the build.
      flows:
        clientCredentials:
          tokenUrl: https://your-build.simprosuite.com/oauth2/token
          scopes: {}
        authorizationCode:
          authorizationUrl: https://your-build.simprosuite.com/oauth2/authorize
          tokenUrl: https://your-build.simprosuite.com/oauth2/token
          scopes: {}
  parameters:
    CompanyID:
      name: companyID
      in: path
      required: true
      description: >-
        The company ID. A build with Multi-company setup may have companyID >= 0;
        other builds use 0 by default.
      schema:
        type: integer
        default: 0
    CustomerID:
      name: customerID
      in: path
      required: true
      description: The customer's ID.
      schema:
        type: integer
    SiteID:
      name: siteID
      in: path
      required: true
      description: The site's ID.
      schema:
        type: integer
    JobID:
      name: jobID
      in: path
      required: true
      description: The job's ID.
      schema:
        type: integer
    QuoteID:
      name: quoteID
      in: path
      required: true
      description: The quote's ID.
      schema:
        type: integer
    InvoiceID:
      name: invoiceID
      in: path
      required: true
      description: The invoice's ID.
      schema:
        type: integer
    ScheduleID:
      name: scheduleID
      in: path
      required: true
      description: The schedule record's ID.
      schema:
        type: integer
    VendorOrderID:
      name: vendorOrderID
      in: path
      required: true
      description: The vendor order's ID.
      schema:
        type: integer
    CostCenterID:
      name: costCenterID
      in: path
      required: true
      description: The cost center's ID.
      schema:
        type: integer
    StorageDeviceID:
      name: storageDeviceID
      in: path
      required: true
      description: The storage device's ID.
      schema:
        type: integer
    CatalogID:
      name: catalogID
      in: path
      required: true
      description: The catalog item's ID.
      schema:
        type: integer
    WebhookID:
      name: webhookID
      in: path
      required: true
      description: The webhook subscription's ID.
      schema:
        type: integer
    Search:
      name: search
      in: query
      required: false
      description: >-
        Search filter. With search=all the result must match all provided
        fields; with search=any it may match any of them.
      schema:
        type: string
    Columns:
      name: columns
      in: query
      required: false
      description: When listing or searching a resource, specify which columns to display.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    OrderBy:
      name: orderby
      in: query
      required: false
      description: >-
        Order of the requested records. Prefix a column name with '-' for
        descending order. A comma-separated list may be provided.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    PageSize:
      name: pageSize
      in: query
      required: false
      description: The maximum number of results to return per page.
      schema:
        type: integer
    Page:
      name: page
      in: query
      required: false
      description: The page number on a paginated request.
      schema:
        type: integer
    Limit:
      name: limit
      in: query
      required: false
      description: The limit on the number of records in a request.
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Missing or invalid OAuth2 Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Modeled error envelope. Verify the exact shape against the Simpro API reference.
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              key:
                type: string
    CompanyListItem:
      type: object
      description: Confirmed fields from the companies list response.
      properties:
        ID:
          type: integer
        Name:
          type: string
    CustomerListItem:
      type: object
      description: Confirmed fields from the customers list response.
      properties:
        ID:
          type: integer
          description: This customer's ID.
        _href:
          type: string
          description: Link to this customer's details.
        CompanyName:
          type: string
          description: Company name (company customers).
        GivenName:
          type: string
          description: Given / first name (individual customers).
        FamilyName:
          type: string
          description: Family / last name (individual customers).
    CustomerInput:
      type: object
      description: >-
        Modeled minimal create/update body. The real Simpro customer payload has
        many more fields (address, contacts, pricing, tax, custom fields).
      properties:
        CompanyName:
          type: string
        GivenName:
          type: string
        FamilyName:
          type: string
    SiteListItem:
      type: object
      description: Modeled from the sites resource. Verify field names against the Simpro API reference.
      properties:
        ID:
          type: integer
        Name:
          type: string
    SiteInput:
      type: object
      description: Modeled minimal create/update body for a site.
      properties:
        Name:
          type: string
    JobListItem:
      type: object
      description: Confirmed fields from the jobs list response.
      properties:
        ID:
          type: integer
          description: This job's ID.
        Description:
          type: string
          description: Supports HTML formatting.
        Total:
          type: object
          properties:
            ExTax:
              type: number
            Tax:
              type: number
            IncTax:
              type: number
    JobInput:
      type: object
      description: >-
        Modeled minimal create body. Real job creation accepts many more fields;
        see the Simpro API reference.
      properties:
        CustomerID:
          type: integer
        SiteID:
          type: integer
        Description:
          type: string
    QuoteListItem:
      type: object
      description: Modeled from the quotes resource. Verify field names against the Simpro API reference.
      properties:
        ID:
          type: integer
        Description:
          type: string
        Total:
          type: object
          properties:
            ExTax:
              type: number
            Tax:
              type: number
            IncTax:
              type: number
    QuoteInput:
      type: object
      description: Modeled minimal create/update body for a quote.
      properties:
        CustomerID:
          type: integer
        SiteID:
          type: integer
        Description:
          type: string
    InvoiceListItem:
      type: object
      description: Modeled from the invoices resource. Verify field names against the Simpro API reference.
      properties:
        ID:
          type: integer
        Total:
          type: object
          properties:
            ExTax:
              type: number
            Tax:
              type: number
            IncTax:
              type: number
    InvoiceInput:
      type: object
      description: Modeled minimal create/update body for an invoice.
      properties:
        Type:
          type: string
        CustomerID:
          type: integer
    ScheduleListItem:
      type: object
      description: Modeled from the schedules resource. Verify field names against the Simpro API reference.
      properties:
        ID:
          type: integer
        Staff:
          type: object
          additionalProperties: true
        Date:
          type: string
          format: date
    VendorOrderListItem:
      type: object
      description: Modeled from the vendor orders resource. Verify field names against the Simpro API reference.
      properties:
        ID:
          type: integer
        Reference:
          type: string
    VendorOrderInput:
      type: object
      description: Modeled minimal create/update body for a vendor order.
      properties:
        Vendor:
          type: integer
    CostCenterListItem:
      type: object
      description: Modeled from the cost centers resource. Verify field names against the Simpro API reference.
      properties:
        ID:
          type: integer
        Name:
          type: string
    CostCenterInput:
      type: object
      description: Modeled minimal create/update body for a cost center.
      properties:
        Name:
          type: string
    StockListItem:
      type: object
      description: Modeled from the storage-device stock resource. Verify field names against the Simpro API reference.
      properties:
        Catalog:
          type: object
          additionalProperties: true
        Quantity:
          type: number
    WebhookListItem:
      type: object
      description: Modeled from the webhook subscriptions resource. Verify field names against the Simpro API reference.
      properties:
        ID:
          type: integer
        Reference:
          type: string
        CallbackURL:
          type: string
          format: uri
    WebhookInput:
      type: object
      description: Modeled minimal create/update body for a webhook subscription.
      properties:
        Reference:
          type: string
        CallbackURL:
          type: string
          format: uri
        Events:
          type: array
          items:
            type: string
