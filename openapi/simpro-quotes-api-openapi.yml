openapi: 3.2.0
info:
  title: Simpro REST Quotes API
  description: The Simpro (simPRO) REST API v1.0 provides a RESTful interface to view, create, and modify resources on a Simpro Premium build - the field service, trade, and project management platform.
  version: '1.0'
  contact:
    name: Simpro Developer Center
    url: https://developer.simprogroup.com/
  x-access-model: Not a shared public API. Access requires an existing Simpro Premium subscription and API access enabled on that build; OAuth2 client credentials are provisioned per build by the account administrator. Base host is the customer's own build subdomain, not a single global endpoint.
servers:
- url: https://{build}.simprosuite.com/api/v1.0
  description: Per-build Simpro Premium host. Replace {build} with your build subdomain.
  variables:
    build:
      default: your-build
      description: Your Simpro Premium build subdomain - the same domain you use to log in to the Simpro staff portal (e.g. mycompany in mycompany.simprosuite.com).
security:
- oauth2: []
tags:
- name: Quotes
  description: Quote creation and management.
paths:
  /companies/{companyID}/quotes/:
    parameters:
    - $ref: '#/components/parameters/CompanyID'
    get:
      operationId: listQuotes
      tags:
      - Quotes
      summary: List all quotes
      parameters:
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: A list of quotes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createQuote
      tags:
      - Quotes
      summary: Create a quote
      description: NOTE - request body is modeled minimally; see the Simpro API reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteInput'
      responses:
        '201':
          description: The created quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /companies/{companyID}/quotes/{quoteID}:
    parameters:
    - $ref: '#/components/parameters/CompanyID'
    - $ref: '#/components/parameters/QuoteID'
    get:
      operationId: getQuote
      tags:
      - Quotes
      summary: Retrieve a quote
      responses:
        '200':
          description: The requested quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateQuote
      tags:
      - Quotes
      summary: Update a quote
      description: NOTE - request body is modeled minimally; see the Simpro API reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteInput'
      responses:
        '200':
          description: The updated quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteQuote
      tags:
      - Quotes
      summary: Delete a quote
      responses:
        '204':
          description: The quote was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    QuoteInput:
      type: object
      description: Modeled minimal create/update body for a quote.
      properties:
        CustomerID:
          type: integer
        SiteID:
          type: integer
        Description:
          type: string
    QuoteListItem:
      type: object
      description: Modeled from the quotes resource. Verify field names against the Simpro API reference.
      properties:
        ID:
          type: integer
        Description:
          type: string
        Total:
          type: object
          properties:
            ExTax:
              type: number
            Tax:
              type: number
            IncTax:
              type: number
    Error:
      type: object
      description: Modeled error envelope. Verify the exact shape against the Simpro API reference.
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              key:
                type: string
  responses:
    BadRequest:
      description: The request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid OAuth2 Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    PageSize:
      name: pageSize
      in: query
      required: false
      description: The maximum number of results to return per page.
      schema:
        type: integer
    CompanyID:
      name: companyID
      in: path
      required: true
      description: The company ID. A build with Multi-company setup may have companyID >= 0; other builds use 0 by default.
      schema:
        type: integer
        default: 0
    QuoteID:
      name: quoteID
      in: path
      required: true
      description: The quote's ID.
      schema:
        type: integer
    OrderBy:
      name: orderby
      in: query
      required: false
      description: Order of the requested records. Prefix a column name with '-' for descending order. A comma-separated list may be provided.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    Search:
      name: search
      in: query
      required: false
      description: Search filter. With search=all the result must match all provided fields; with search=any it may match any of them.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: The page number on a paginated request.
      schema:
        type: integer
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'OAuth2 issued by the customer''s own Simpro build. Access tokens are obtained from https://{build}.simprosuite.com/oauth2/token and sent as `Authorization: Bearer ACCESS_TOKEN`. Both the client credentials and authorization code grants are supported depending on how the API application is registered on the build.'
      flows:
        clientCredentials:
          tokenUrl: https://your-build.simprosuite.com/oauth2/token
          scopes: {}
        authorizationCode:
          authorizationUrl: https://your-build.simprosuite.com/oauth2/authorize
          tokenUrl: https://your-build.simprosuite.com/oauth2/token
          scopes: {}
