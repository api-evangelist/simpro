  endpointsModeledNote: |
    The paths, HTTP methods, and the common list/search query parameters
    (search, columns, pageSize, page, orderby, limit) above are grounded in
    Simpro's published REST API v1.0 reference. The list/read RESPONSE FIELDS
    modeled in the OpenAPI for companies (ID, Name), customers (ID, _href,
    CompanyName, GivenName, FamilyName), and jobs (ID, Description, Total)
    are confirmed from the documented example responses. All create/update
    REQUEST bodies, error envelopes, and the schemas for sites, quotes,
    invoices, schedules, vendor orders, cost centers, stock, and webhooks are
    MODELED minimally and flagged as such in the OpenAPI - the real Simpro
    payloads are large and build-configuration dependent. The published API
    spans 300+ resource types; only a representative subset is modeled here.
  rateLimiting: |
    Simpro enforces an API rate limit of 10 calls per second scoped to the
    whole Simpro domain/build (effective 9 August 2022). Exceeding it returns
    HTTP 429; clients should back off and retry.
