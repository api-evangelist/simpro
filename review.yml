aid: simpro
name: Simpro
review:
  question: Does Simpro expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Simpro's documented API surface is
    request/response REST over HTTPS (the Simpro REST API v1.0). The only
    asynchronous, server-initiated mechanism is webhook subscriptions, where
    Simpro POSTs an HTTPS callback to a URL you register under
    /api/v1.0/companies/{companyID}/setup/webhooks/. Webhooks are
    server-to-endpoint HTTP delivery, not a persistent WebSocket (ws:// or
    wss://) or SSE stream on Simpro's own API, so there is no server-push
    transport on Simpro's API to model in AsyncAPI.
findings:
  summary: |
    Simpro does not publish a documented public WebSocket API. Simpro is field
    service and project/business management software for the trades. Its
    documented programmatic surface is the Simpro REST API v1.0, a RESTful
    HTTPS interface for viewing, creating, and modifying resources on a Simpro
    Premium build. It is not a shared multi-tenant public API: each API runs on
    the customer's own build host (https://your-build.simprosuite.com) and is
    authenticated with OAuth2 access tokens issued by that build's
    /oauth2/token endpoint. Most resources are nested under a company at
    /api/v1.0/companies/{companyID}/... (companyID 0 on single-company builds).
    Real-time change notification is offered through webhook subscriptions
    (outbound HTTPS callbacks), not WebSockets. No ws:// or wss:// endpoint is
    documented anywhere in the Simpro API reference.
  accessModel: |
    Access requires an existing Simpro Premium subscription with API access
    enabled on the build. An account administrator registers an API
    application on the build and provisions OAuth2 client credentials; the
    integration then requests access tokens from the same build subdomain used
    to log in to the staff portal. There is no open self-service sandbox or
    global API host - the base host is per-build.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://{build}.simprosuite.com/api/v1.0
      documented: true
      note: Simpro REST API v1.0. Per-build host; resources nested under /companies/{companyID}/.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Webhook subscriptions POST HTTPS callbacks to your endpoint on build events. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the Simpro API reference as of the review date.
