actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Simpro's own public API is
    request/response REST (Simpro REST API v1.0), with asynchronous
    notifications delivered only via outbound HTTPS webhook callbacks. No
    AsyncAPI document was created because there is no WebSocket or SSE
    server-push transport on Simpro's API to model.
