aid: simpro
url: https://raw.githubusercontent.com/api-evangelist/simpro/refs/heads/main/apis.yml
name: Simpro
kind: company
description: Simpro (simPRO) is field service management and project/business
  management software for the trades - electrical, plumbing, HVAC, security, fire,
  and other contractors. It covers the full workflow of estimating, quoting, job
  management, scheduling and dispatch, asset maintenance, inventory and catalog,
  purchasing, timesheets, and invoicing. The Simpro REST API v1.0 exposes these
  resources over HTTPS, but it is not a shared public API - each API runs on the
  customer's own Simpro Premium build (host https://your-build.simprosuite.com)
  and is authenticated with OAuth2 credentials provisioned by that build's
  administrator. Resources are nested under a company at
  /api/v1.0/companies/{companyID}/... where companyID is 0 on single-company
  builds.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Field Service Management
- Trades
- Job Management
- Project Management
- Scheduling
- Inventory
- Estimating
- Workforce
- SaaS
- Contractors
created: '2026-07-12'
modified: '2026-07-12'
specificationVersion: '0.19'
apis:
- aid: simpro:simpro-companies-api
  name: Simpro Companies API
  tags:
  - Companies
  - Configuration
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.simprogroup.com/apidoc/
  baseURL: https://{build}.simprosuite.com/api/v1.0
  properties:
  - url: https://developer.simprogroup.com/
    type: Documentation
  - url: https://developer.simprogroup.com/apidoc/
    type: APIReference
  - url: openapi/simpro-openapi.yml
    type: OpenAPI
  description: List and retrieve the companies configured on a Simpro build. On
    multi-company builds companyID may be greater than 0; single-company builds
    use companyID 0. The company is the top-level scope for nearly every other
    resource in the API.
- aid: simpro:simpro-customers-api
  name: Simpro Customers API
  tags:
  - Customers
  - CRM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.simprogroup.com/apidoc/
  baseURL: https://{build}.simprosuite.com/api/v1.0
  properties:
  - url: https://developer.simprogroup.com/apidoc/
    type: APIReference
  - url: openapi/simpro-openapi.yml
    type: OpenAPI
  description: Create, list, retrieve, update, and delete company (organization)
    and individual customers - the entities that receive invoices for work
    performed. Includes the combined customers listing plus the separate
    /customers/companies and /customers/individuals collections.
- aid: simpro:simpro-sites-api
  name: Simpro Sites API
